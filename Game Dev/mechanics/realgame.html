let deltaX;

     centerX = gameArea.left + (gameArea.width/2);
  centerY = gameArea.top + (gameArea.height/2);

    // 3. Calculate distance from the center to the user's cursor
     deltaX = `${e.clientX - 25}` - centerX;
     deltaY = `${e.clientY - 25}` - centerY;
    const distance = Math.hypot(deltaX, deltaY);
    
    let targetX, targetY;
    
    // 4. THE CLAMP: If the cursor goes out of the circle, lock it to the edge
    if (distance > radiusLimit) {
        // Find the angle and multiply by the max allowed radius
        targetX = centerX + (deltaX / distance) * radiusLimit;
        targetY = centerY + (deltaY / distance) * radiusLimit;
    } else {
        // Otherwise, track the cursor directly
        targetX = e.clientX;
        targetY =e.clientY;
    }
    
    // 5. Shift drawing point by half of the user's width to keep touch centered
    user1.style.left = `${targetX - (user1.offsetWidth / 2)}px`;

element.style.transform = `translate(${randomIndex.x}px, ${randomIndex.y}px)`;

            }, 400); 
        }, 600); // How long the item stays inside the box (1.5 seconds)
    });
}

function isColliding(a, b) {
    const aRect = a.getBoundingClientRect();
    const bRect = b.getBoundingClientRect();

return ! (
    aRect.top > bRect.bottom ||
    aRect.bottom < bRect.top ||
    aRect.left > bRect.right ||
    aRect.right < bRect.left 
);


}
