// 1. Initial Pointer Down Event
user1.addEventListener('pointerdown', (e) => {
    isMoving = true;
    // Set capture so the tracking is maintained even if dragging fast outside elements
    user1.setPointerCapture(e.pointerId);
    
    const gameArea = gamering.getBoundingClientRect();
    startX = e.clientX - gameArea.left;
    startY = e.clientY - gameArea.top;
    
    user1.style.background = "orange";
    eaterMouth.id = "eaterMouth";
    // ... (Keep your mouth element styling properties exactly as you written them) ...
    
    if(!user1.contains(eaterMouth)) {
        user1.appendChild(eaterMouth);
    }
});

// 2. Unify Pointer Tracking Movement Loop
document.addEventListener('pointermove', (e) => {
    if (!isMoving) return;
    
    const gameArea = gamering.getBoundingClientRect();
    
    // Calculate cursor positions RELATIVE to the game box boundaries, not raw monitor edges
    const relativeX = e.clientX - gameArea.left;
    const relativeY = e.clientY - gameArea.top;
    
    user1.style.position = 'absolute';
    user1.style.left = `${relativeX - 25}px`; 
    user1.style.top = `${relativeY - 25}px`;
    eaterMouth.style.display = "flex";
});

// 3. Pointer Release Trigger (Handles the Circular Boundary Clamping)
document.addEventListener('pointerup', (e) => {
    if (!isMoving) return;
    e.preventDefault();
    isMoving = false;
    user1.releasePointerCapture(e.pointerId);
    
    user1.style.removeProperty('background');
    eaterMouth.style.display = "none";
    
    const gameArea = gamering.getBoundingClientRect();
    
    // Relative position conversion for math logic calculation
    const currentRelativeX = e.clientX - gameArea.left;
    const currentRelativeY = e.clientY - gameArea.top;
    
    const movedDistance = Math.hypot(currentRelativeX - startX, currentRelativeY - startY);
    
    const centerX = gameArea.width / 2;
    const centerY = gameArea.height / 2;
    const radiusLimit = (gameArea.width / 2) - (user1.offsetWidth / 2);
    
    const deltaX = (currentRelativeX - 25) - centerX;
    const deltaY = (currentRelativeY - 25) - centerY;
    const distance = Math.hypot(deltaX, deltaY);
    
    let targetX, targetY;
    
    if (distance > radiusLimit) {
        targetX = centerX + (deltaX / distance) * radiusLimit;
        targetY = centerY + (deltaY / distance) * radiusLimit;
    } else {
        targetX = currentRelativeX;
        targetY = currentRelativeY;
    }
    
    user1.style.left = `${targetX - (user1.offsetWidth / 2)}px`;
    user1.style.top = `${targetY - (user1.offsetHeight / 2)}px`;
    
    // Bounding Box Logic confirmation (Relative to localized game viewport bounds)
    const inBox = (
        (targetX - 25) < gameArea.width &&
        (targetX + 25) > 0 &&
        (targetY - 25) < gameArea.height &&
        (targetY + 25) > 0
    );
    
    if(inBox && !sceneDone && movedDistance > 4) {
        sceneDone = true;
    }
    
    user1.style.background = "orange";
});

function spawnJuice() {
    if(document.querySelectorAll('.juice, .juice1, .juice2').length >= 1) return;

    const juices = document.createElement("div");
    juices.classList.add("juice"); // Ensure it has a baseline selector class

    // Dynamic measurement calculation
    const maxWidth = gameBorder.clientWidth - 40; 
    const maxHeight = gameBorder.clientHeight - 40;
    
    const x = Math.floor(Math.random() * Math.max(10, maxWidth));
    const y = Math.floor(Math.random() * Math.max(10, maxHeight));

    juices.style.left = x + "px";
    juices.style.top = y + "px";

    const directions = [
        {x: -150, y: 0},
        {x: 150, y: 0},
        {x: 0, y: -150},
        {x: 0, y: 150},
    ];

    // FIX: Properly extract the integer index value to lookup the object array coordinate keys
    const randomIndexNum = Math.floor(Math.random() * directions.length);
    const chosenDirection = directions[randomIndexNum];
    juices.style.transform = `translate(${chosenDirection.x}px, ${chosenDirection.y}px)`;

    setTimeout(() => {
        juices.classList.remove('slide-in');
        setTimeout(() => {
            if (juices.parentNode) juices.remove();
        }, 400); 
    }, 600); 
}

// 3. Normalized Collision Checks bounding system limits
function isColliding(a, b) {
    const aRect = a.getBoundingClientRect();
    const bRect = b.getBoundingClientRect();

    return !(
        aRect.top > bRect.bottom ||
        aRect.bottom < bRect.top ||
        aRect.left > bRect.right ||
        aRect.right < bRect.left 
    );
}

function updateVolume(pixelX) {
     const rect = gameVolume.getBoundingClientRect();

    let percentage = (e.clientX - rect.left) / rect.width;
    
    // Clamp the percentage limit scale strict values from 0% up to 100%

    progress.style.width = `${percentage * 100}%`;
    gameVolume.setAttribute("aria-valuenow", Math.round(percentage * 100));
}

// Bind universal listeners to support dragging the volume bar fluidly
gameVolume.addEventListener("pointerdown", (e) => {
    gameVolume.setPointerCapture(e.pointerId);
    updateVolume(e);
    
    const dragVolume = (event) => updateVolume(event);

          gameVolume.addEventListener("pointermove", dragVolume);

    gameVolume.addEventListener("pointerup", () => {
        gameVolume.removeEventListener("pointermove", dragVolume);
    }, { once: true });
});
    if (e.pointerType === 'mouse' || e.pointerType === 'touch') return; 
    updateVolume(e.clientX);
});
